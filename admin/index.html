<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="robots" content="noindex">
<title>Yönetim paneli</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#08070a;--pn:#0d0b0f;--ln:rgba(255,255,255,.1);--mu:rgba(226,232,240,.66);--ac:#ff3b30;--lt:#ff9a94;color-scheme:dark}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{background:radial-gradient(circle at 50% 0,rgba(255,59,48,.12),transparent 55%),var(--bg);color:#f8fafc;font:15px/1.55 Inter,system-ui,sans-serif;min-height:100vh}
h1,h2{font-family:'Inter Tight',Inter,sans-serif;letter-spacing:-.02em}h2{font-size:1.9rem;margin-bottom:4px}.sub{color:var(--mu);margin-bottom:22px}
input,textarea{width:100%;font:inherit;color:#f8fafc;background:rgba(255,255,255,.04);border:1px solid var(--ln);border-radius:12px;padding:10px 13px}
input:focus,textarea:focus{outline:0;border-color:var(--lt)}input[type=checkbox]{width:auto}
label{display:block;font-size:13px;color:var(--mu);margin:14px 0 5px}
.btn{font:500 14px Inter;color:#fff;border:1px solid var(--ln);background:rgba(255,255,255,.05);border-radius:99px;padding:8px 18px;cursor:pointer}.btn:hover{border-color:var(--lt)}
.btn.p{background:var(--ac);border:0}.btn.s{padding:5px 12px;font-size:13px}.btn.d{color:var(--lt)}
.lgn{min-height:100vh;display:grid;place-items:center;padding:20px}.lgn form{width:min(360px,100%);background:var(--pn);border:1px solid var(--ln);border-radius:22px;padding:30px}
.lgn h1{font-size:1.7rem;margin-bottom:8px}.lgn .btn{margin-top:18px;width:100%}#le{color:var(--lt);margin-top:10px;font-size:14px}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--pn);border-right:1px solid var(--ln);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px}
aside .lo{font:700 22px 'Inter Tight';padding:0 12px 18px}aside .lo b{color:var(--ac)}
aside button.n{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 12px;border-radius:10px;color:var(--mu);width:100%}
aside button.n:hover{color:#fff;background:rgba(255,255,255,.04)}aside button.n.on{background:rgba(255,59,48,.2);color:#fff}
aside .f{margin-top:auto;display:grid;gap:8px}
main{padding:32px 40px;max-width:980px;width:100%}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:18px;padding:18px 20px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}.st b{display:block;font:600 2rem 'Inter Tight'}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--ln)}.row:first-child{border-top:0}
.row .th{width:64px;height:48px;border-radius:10px;background:linear-gradient(135deg,#2a0a0c,#a3161c);object-fit:cover;flex:none}
.row .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .ac{display:flex;gap:6px;flex:none}
.ft{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid rgba(255,59,48,.4);color:var(--lt);margin-left:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;overflow:auto;padding:24px 14px}
.md{max-width:640px;margin:0 auto;background:var(--pn);border:1px solid var(--ln);border-radius:22px;padding:24px}
.md .ac2{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.im{display:flex;align-items:center;gap:14px}.im img{width:110px;height:76px;object-fit:cover;border-radius:12px;background:#1a0a0c}
.pr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.mg div{background:var(--pn);border:1px solid var(--ln);border-radius:14px;overflow:hidden;font-size:12px}
.mg img{width:100%;height:100px;object-fit:cover;display:block}.mg p{padding:8px 10px;word-break:break-all;color:var(--mu)}
.ms{white-space:pre-wrap;color:var(--mu);margin:8px 0}
.tt{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#f8fafc;color:#08070a;padding:10px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:40;font-weight:500}.tt.s{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--ln)}aside .lo,aside .f{display:none}aside button.n{white-space:nowrap;width:auto}main{padding:22px 16px}.pr{grid-template-columns:1fr}}
</style></head><body>
<div class="lgn" id="lg" hidden><form id="lf"><h1>Yönetim paneli</h1><p class="sub" style="margin:0">Devam etmek için giriş yap.</p>
<label for="em">E-posta</label><input id="em" type="email" autocomplete="username" required>
<label for="pw">Şifre</label><input id="pw" type="password" autocomplete="current-password" required><button class="btn p">Giriş yap</button><p id="le"></p></form></div>
<div id="app" hidden><aside><div class="lo">İ<b>.</b> panel</div><div id="nv" style="display:contents"></div>
<div class="f"><a class="btn s" href="../index.html" target="_blank" style="text-align:center;text-decoration:none">Siteyi aç</a><button class="btn s" id="out">Çıkış yap</button></div></aside><main id="mn"></main></div>
<div class="ov" id="ov" hidden></div><div class="tt" id="tt"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script>
<script>
var $=function(s){return document.querySelector(s)},C,V='dash',J={'Content-Type':'application/json'};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var g=function(o,p){return p.split('.').reduce(function(a,k){return a&&a[k]},o)};
var st=function(o,p,v){var a=p.split('.'),l=a.pop();a.reduce(function(x,k){return x[k]=x[k]||{}},o)[l]=v};
function toast(m){var t=$('#tt');t.textContent=m;t.className='tt s';setTimeout(function(){t.className='tt'},1800)}
var CF=window.CMS_CONFIG||{},SB=CF.SUPABASE_URL&&CF.SUPABASE_KEY?supabase.createClient(CF.SUPABASE_URL,CF.SUPABASE_KEY):null;
var SRC=function(u){return!u?'':/^(https?:|data:|blob:)/.test(u)?u:'../'+u};
function ok(r){if(r.error){if(r.error.status==401||/JWT/i.test(r.error.message||'')){gate()}throw r.error}return r.data}
var DB={
 load:function(){return SB.from('cms_store').select('data').eq('id','main').maybeSingle().then(ok).then(function(d){if(d&&d.data)return d.data;
  return fetch('../content.json').then(function(r){return r.json()}).then(function(c){return SB.from('cms_store').upsert({id:'main',data:c}).then(ok).then(function(){return c})})})},
 save:function(c){var now=new Date().toISOString();return SB.from('cms_store').select('data').eq('id','main').maybeSingle().then(ok).then(function(cur){
  return cur?SB.from('cms_store').upsert({id:'backup',data:cur.data,updated_at:now}).then(ok):0}).then(function(){return SB.from('cms_store').upsert({id:'main',data:c,updated_at:now}).then(ok)})},
 msgs:function(){return SB.from('cms_messages').select('*').order('created_at',{ascending:false}).then(ok).then(function(d){return(d||[]).map(function(x){return{id:x.id,d:x.created_at,n:x.name,e:x.email,s:x.subject,m:x.message}})})},
 delMsg:function(id){return SB.from('cms_messages').delete().eq('id',id).then(ok)},
 upload:function(name,blob){var slug=name.toLowerCase().replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u').replace(/\.\w+$/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'foto',fn=Date.now()+'-'+slug+'.jpg';
  return SB.storage.from('media').upload(fn,blob,{contentType:'image/jpeg',upsert:true}).then(ok).then(function(){return{url:SB.storage.from('media').getPublicUrl(fn).data.publicUrl}})},
 media:function(){return SB.storage.from('media').list('',{limit:100,sortBy:{column:'created_at',order:'desc'}}).then(ok).then(function(d){return(d||[]).filter(function(x){return x.name&&x.name[0]!='.'&&x.id}).map(function(x){return{name:x.name,url:SB.storage.from('media').getPublicUrl(x.name).data.publicUrl}})})},
 delMedia:function(n){return SB.storage.from('media').remove([n]).then(ok)},
 pass:function(o,n){if(String(n).length<8)return Promise.reject('kısa');return SB.auth.getUser().then(ok).then(function(d){return SB.auth.signInWithPassword({email:d.user.email,password:o}).then(ok)}).then(function(){return SB.auth.updateUser({password:n}).then(ok)})}
};
function gate(){$('#app').hidden=true;$('#lg').hidden=false}
var SC={projects:{n:'Projeler',o:'Proje',lb:function(x){return x.tr.title},f:[['image','Görsel','img'],['tr.title','Başlık (TR)'],['en.title','Title (EN)'],['tr.desc','Açıklama (TR)','ta'],['en.desc','Description (EN)','ta'],['featured','Anasayfada öne çıkar','cb']]},
gallery:{n:'Galeri',o:'Fotoğraf',lb:function(x){return x.tr.cap},f:[['image','Görsel','img'],['tr.cap','Açıklama (TR)','ta'],['en.cap','Caption (EN)','ta']]},
posts:{n:'Blog yazıları',o:'Yazı',lb:function(x){return x.tr.title},f:[['tr.title','Başlık (TR)'],['en.title','Title (EN)'],['tr.body','İçerik (TR)','tx'],['en.body','Content (EN)','tx'],['tr.cats','Kategoriler (TR, virgülle ayır)'],['en.cats','Categories (EN, same order)'],['tr.tags','Etiketler (TR, virgülle ayır)'],['en.tags','Tags (EN)']]}};
var TX=[['hero_title','Anasayfa ana başlık'],['hero_k','Anasayfa alt başlık'],['hero_d','Anasayfa açıklama'],['about_sum','Hakkımda özeti (anasayfa)'],['addr','Adres'],['phone','Telefon',1],['email','E-posta',1]];
var NAV=[['dash','Panel'],['projects','Projeler'],['gallery','Galeri'],['posts','Blog yazıları'],['site','Site metinleri'],['msgs','Mesajlar'],['media','Medya'],['set','Ayarlar']];
function save(){return DB.save(C).then(function(){toast('Kaydedildi')}).catch(function(e){console.error(e);toast('Kaydedilemedi')})}
function nav(){$('#nv').innerHTML=NAV.map(function(n){return'<button class="n'+(n[0]==V?' on':'')+'" data-v="'+n[0]+'">'+n[1]+'</button>'}).join('')}
function show(v){V=v;nav();var m=$('#mn');
if(v=='dash'){DB.msgs().catch(function(){return[]}).then(function(ms){m.innerHTML='<h2>Hoş geldin</h2><p class="sub">Sitenin içeriğini buradan yönetirsin. Değişiklikler kaydedildiği an sitede görünür.</p><div class="st">'+[['Proje',C.projects.length],['Galeri',C.gallery.length],['Yazı',C.posts.length],['Mesaj',ms.length]].map(function(x){return'<div class="card"><b>'+x[1]+'</b>'+x[0]+'</div>'}).join('')+'</div>'})}
else if(SC[v]){var s=SC[v];m.innerHTML='<div class="hd"><div><h2>'+s.n+'</h2><p class="sub">Sırayı oklarla değiştir, düzenlemek için Düzenle’ye bas.</p></div><button class="btn p" data-a="new">+ Yeni '+s.o.toLowerCase()+'</button></div><div class="card">'+(C[v].length?C[v].map(function(x,i){return'<div class="row">'+(x.image?'<img class="th" src="'+esc(SRC(x.image))+'" alt="" onerror="this.removeAttribute(\'src\')">':'')+'<div class="lb">'+esc(s.lb(x))+(x.featured?'<span class="ft">öne çıkan</span>':'')+'</div><div class="ac"><button class="btn s" data-a="up" data-i="'+i+'">↑</button><button class="btn s" data-a="dn" data-i="'+i+'">↓</button><button class="btn s" data-a="ed" data-i="'+i+'">Düzenle</button><button class="btn s d" data-a="del" data-i="'+i+'">Sil</button></div></div>'}).join(''):'<p class="sub" style="margin:0">Henüz kayıt yok.</p>')+'</div>'}
else if(v=='site'){m.innerHTML='<div class="hd"><div><h2>Site metinleri</h2><p class="sub">Anasayfa ve iletişim bilgileri.</p></div><button class="btn p" data-a="svs">Kaydet</button></div><div class="card">'+TX.map(function(t){return'<label>'+t[1]+(t[2]?'':' (Türkçe)')+'</label><input data-p="site.'+t[0]+'.tr" value="'+esc(C.site[t[0]].tr)+'">'+(t[2]?'':'<label>'+t[1]+' (English)</label><input data-p="site.'+t[0]+'.en" value="'+esc(C.site[t[0]].en)+'">')}).join('')+'</div>'}
else if(v=='msgs'){DB.msgs().then(function(ms){m.innerHTML='<h2>Mesajlar</h2><p class="sub">İletişim formundan gelenler.</p>'+(ms.length?ms.map(function(x){return'<div class="card" style="margin-bottom:12px"><div class="hd"><b>'+esc(x.n)+'</b><span class="sub" style="margin:0">'+new Date(x.d).toLocaleString('tr-TR')+'</span></div><a href="mailto:'+esc(x.e)+'" style="color:var(--lt)">'+esc(x.e)+'</a>'+(x.s?' · '+esc(x.s):'')+'<p class="ms">'+esc(x.m)+'</p><button class="btn s d" data-a="dm" data-i="'+esc(x.id)+'">Sil</button></div>'}).join(''):'<div class="card">Henüz mesaj yok.</div>')})}
else if(v=='media'){DB.media().then(function(ms){m.innerHTML='<h2>Medya</h2><p class="sub">Panelden yüklenen görseller (otomatik küçültülür).</p><div class="mg">'+(ms.map(function(x){return'<div><img src="'+esc(SRC(x.url))+'" alt=""><p>'+esc(x.name)+'</p><p><button class="btn s d" data-a="dmd" data-i="'+esc(x.name)+'">Sil</button></p></div>'}).join('')||'Henüz görsel yok.')+'</div>'})}
else{m.innerHTML='<h2>Ayarlar</h2><p class="sub">Şifreni değiştir (en az 8 karakter).</p><div class="card" style="max-width:420px"><label>Mevcut şifre</label><input id="po" type="password" autocomplete="current-password"><label>Yeni şifre</label><input id="pn" type="password" autocomplete="new-password"><button class="btn p" style="margin-top:18px" data-a="pw">Şifreyi değiştir</button></div>'}}
function up(f){return createImageBitmap(f).then(function(b){var k=Math.min(1,1600/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
return new Promise(function(r){c.toBlob(r,'image/jpeg',.82)})}).then(function(bl){return DB.upload(f.name,bl)})}
function edit(k,i){var s=SC[k],x=i<0?{tr:{},en:{}}:JSON.parse(JSON.stringify(C[k][i])),o=$('#ov');
o.innerHTML='<div class="md"><h2>'+(i<0?'Yeni ':'')+s.o+'</h2>'+s.f.map(function(f){var v=g(x,f[0]),t=f[2];
if(t=='img')return'<label>'+f[1]+'</label><div class="im"><img id="pv" src="'+esc(SRC(v))+'" alt=""><div><input type="hidden" data-p="image" value="'+esc(v)+'"><input type="file" id="fl" accept="image/*" hidden><button type="button" class="btn s" id="pk">Görsel seç</button> <button type="button" class="btn s d" id="rm">Kaldır</button></div></div>';
if(t=='cb')return'<label><input type="checkbox" data-p="'+f[0]+'"'+(v?' checked':'')+'> '+f[1]+'</label>';
if(t)return'<label>'+f[1]+'</label><textarea rows="'+(t=='tx'?10:3)+'" data-p="'+f[0]+'">'+esc(v)+'</textarea>';
return'<label>'+f[1]+'</label><input data-p="'+f[0]+'" value="'+esc(v)+'">'}).join('')+'<div class="ac2"><button class="btn" id="cn">Vazgeç</button><button class="btn p" id="ok">Kaydet</button></div></div>';o.hidden=false;
var pk=$('#pk');if(pk){pk.onclick=function(){$('#fl').click()};$('#fl').onchange=function(){var f=this.files[0];if(!f)return;pk.textContent='Yükleniyor…';up(f).then(function(r){o.querySelector('[data-p=image]').value=r.url;$('#pv').src=SRC(r.url);pk.textContent='Görsel seç'}).catch(function(){pk.textContent='Görsel seç';toast('Yüklenemedi')})};
$('#rm').onclick=function(){o.querySelector('[data-p=image]').value='';$('#pv').removeAttribute('src')}}
$('#cn').onclick=function(){o.hidden=true};
$('#ok').onclick=function(){o.querySelectorAll('[data-p]').forEach(function(e){st(x,e.dataset.p,e.type=='checkbox'?e.checked:e.value)});if(i<0){x.id=Date.now().toString(36);C[k].push(x)}else C[k][i]=x;o.hidden=true;save().then(function(){show(V)})}}
$('#nv').onclick=function(e){var b=e.target.closest('[data-v]');if(b)show(b.dataset.v)};
$('#mn').onclick=function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,i=+b.dataset.i,l=C[V];
if(a=='new')edit(V,-1);else if(a=='ed')edit(V,i);
else if(a=='del'){if(confirm('Bu kayıt silinsin mi?')){l.splice(i,1);save().then(function(){show(V)})}}
else if(a=='up'&&i>0||a=='dn'&&i<l.length-1){var j=a=='up'?i-1:i+1,t=l[i];l[i]=l[j];l[j]=t;save().then(function(){show(V)})}
else if(a=='svs'){$('#mn').querySelectorAll('[data-p]').forEach(function(e){st(C,e.dataset.p,e.value);if(e.dataset.p.slice(-3)=='.tr'&&/phone|email/.test(e.dataset.p))st(C,e.dataset.p.replace('.tr','.en'),e.value)});save()}
else if(a=='dm'){DB.delMsg(b.dataset.i).then(function(){show('msgs')})}
else if(a=='dmd'){if(confirm('Görsel silinsin mi? Kullanıldığı yerlerde görünmez olur.'))DB.delMedia(b.dataset.i).then(function(){show('media')})}
else if(a=='pw'){DB.pass($('#po').value,$('#pn').value).then(function(){toast('Şifre değişti');$('#po').value=$('#pn').value=''}).catch(function(){toast('Şifre değişmedi. Bilgileri kontrol et.')})}};
$('#out').onclick=function(){SB.auth.signOut().catch(function(){}).then(function(){location.reload()})};
$('#lf').onsubmit=function(e){e.preventDefault();$('#le').textContent='';if(!SB)return;SB.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value}).then(function(r){if(r.error)throw/rate|many/i.test(r.error.message)?'Çok fazla deneme. Biraz sonra tekrar dene.':'E-posta veya şifre yanlış.';start()}).catch(function(m){$('#le').textContent=typeof m=='string'?m:'Bağlantı hatası.'})};
function start(){DB.load().then(function(c){C=c;$('#lg').hidden=true;$('#app').hidden=false;show('dash')}).catch(function(e){console.error(e);gate();$('#le').textContent='İçerik okunamadı. Bu hesabın yönetici yetkisi olduğundan emin ol (supabase-kurulum.sql).'})}
if(!SB){gate();$('#lf').querySelectorAll('input,button').forEach(function(x){x.disabled=true});$('#le').textContent='Panel henüz bağlı değil: config.js dosyasına Supabase publishable anahtarını yaz.'}
else SB.auth.getSession().then(function(r){r.data&&r.data.session?start():gate()}).catch(gate);
</script></body></html>
